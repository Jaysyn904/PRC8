			<div><h1> :: Animal Trance :: </h1></div><br />
			<!-- The icon, if building with icons. icon.html -->
			<div class="div_paddedicon"></div>
			<div>Level: Brd 2, Drd 2
<br />Components: V, S
<br />Casting Time: 1 round
<br />Range: Medium
<br />Targets: Animals, Beasts, or magical beasts with Intelligence 3
<br />Duration: 3 rounds + caster level
<br />Saving Throw: Will negates
<br />Spell Resistance: Yes
<br />
<br />You fascinate 2d6 hit dice of affected creatures.</div>
